# Runner environment: installs only Snakemake (the workflow engine).
#
# All tool and Python dependencies are declared per-rule in workflow/envs/*.yaml
# and built automatically because the profile sets `use-conda: true`. Create this
# env, then run with `--profile profile/` (or pass `--use-conda` yourself).
#
#   conda env create -f environment.yaml
#   conda activate genotyping-env
#   snakemake --profile profile/ --conda-create-envs-only --cores 1 ...
name: genotyping-env
channels:
  - conda-forge
  - bioconda
dependencies:
  # >=9 required: rules use the branch() input helper (added in 8.4) and the
  # injected `snakemake` script global (the old `from snakemake.script import
  # snakemake` import was removed in 9.x). Project standardizes on Snakemake 9+.
  - snakemake>=9
