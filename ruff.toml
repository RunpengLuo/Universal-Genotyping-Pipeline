line-length = 88
# `snakemake` is injected into `script:` files at runtime; treat it as a builtin so
# F821 still flags real undefined-name bugs.
builtins = ["snakemake"]

[lint]
# E402: a Snakemake `script:` file must call set_omp_threads() before numpy is
# imported, so its remaining imports sit below that call.
extend-ignore = ["E402"]
