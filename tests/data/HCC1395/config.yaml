##################################################
# Test case: HCC1395 / HCC1395BL, real triple-negative breast cancer tumor-normal,
# hg38, chr16 only, four assay types (SR WGS + WES + ONT + HiFi) in one multi-sample run.
#
# Data (all open-access, GRCh38, chr-prefixed):
#   - Illumina SR WGS + WES (SEQC2 Somatic Mutation WG, BWA-MEM to GRCh38.d1.vd1):
#       https://ftp-trace.ncbi.nlm.nih.gov/ReferenceSamples/seqc/Somatic_Mutation_WG/data/{WGS,WES}/
#   - ONT (CASTLE, minimap2 GRCh38) and PacBio HiFi (CASTLE, pbmm2 GRCh38):
#       https://storage.googleapis.com/brain-genomics-public/publications/park2024_deepsomatic/bams/
#   All eight BAMs stream by URL (remote_mode: stream); the index (##idx##) lets htslib
#   read only chr16, never the whole-genome/whole-exome BAMs.
#
# chr16: the q-arm is entirely lost with LOH in HCC1395 (16p retained), a clear
#   within-chromosome CN/BAF transition. Masood et al., Genome Biology 25:163 (2024),
#   doi:10.1186/s13059-024-03294-8 (Reproducibility: 6p, 16q, X entirely lost);
#   Fang et al. 2021, doi:10.1038/s41587-021-00993-6.
#   CASTLE ONT/HiFi: Park et al. 2024, BioProject PRJNA1086849.
#
# One shared grid over all bulk assays: genotype het SNPs from the Illumina WGS normal
# (bcftools), phase with eagle against the 1000G n=3202 panel, then pile up + count
# depth for every dataset (WGS/WES/ONT/HiFi, tumor+normal). Each tumor's RDR divides by
# its matched-platform normal (rdr_base_dataset_id in samples.json).
#   Population panel: resources/scripts/process_1kGP_3202_panel.sh --ref hg38 (see README).
##################################################

snp_dir: "snps"
phase_dir: "phase"
pileup_dir: "pileup"
allele_dir: "allele"
bb_dir: "bb"
qc_dir: "qc"
log_dir: "logs"
aux_dir: "aux"

workflow_mode: "bulk_genotyping"
assay_types: ["bulkWGS", "bulkWES", "bulkWGS-lr"]

##################################################
# Input. Remote BAMs read directly by URL (chr16 byte ranges only, no whole-file
# download); requires a reachable alignment_index URL per record (samples.json).
remote_mode: stream
sample_id: HCC1395
sample_file: tests/data/HCC1395/samples.json
chromosomes: [16]

het_snp_vcf: null
het_snp_vcf_phased: true
bb_file: null

##################################################
# Reference (hg38 / GRCh38, chr-prefixed contigs). The pre-built genome-wide hg38
# window BED (GC baked in) and blacklist are used directly; rd_correct filters the
# window BED to `chromosomes`, so a genome-wide file is fine. Reference FASTA + GTF
# are staged under the gitignored .test-run/ dir (see README).
reference_version: "hg38"
reference: .test-run/HCC1395/reference/hg38.fa
genome_size: resources/data/hg38.chrom.sizes
region_bed: resources/data/hg38.regions.bed
window_bed: resources/data/windows.1kbp.hg38.bed.gz
mappability_bed: null
blacklist_bed: resources/data/hg38-blacklist.v2.bed.gz
gene_blacklist_file: null
gtf_file: .test-run/HCC1395/reference/gencode.hg38.gtf.gz

##################################################
# Genotyping from the Illumina normal (bcftools, one dataset). snp_panel is unset -
# the bulk path genotypes off snp_targets (1000G n=3202 target positions).
snp_panel: null
snp_targets: .test-run/HCC1395/reference/target_positions
genotype_dataset_ids: ["N_ILL"]

##################################################
# Population panel (1000G n=3202 phased, GRCh38; biallelic SNPs). Staged as per-chr
# BCF + target position lists by process_1kGP_3202_panel.sh.
phasing_panel: .test-run/HCC1395/reference/phasing_panel

##################################################
# Phasing (Eagle2 statistical phasing against the 1000G panel). One phaser for the
# whole run; the eagle-phased het SNPs are the shared grid all platforms pile up on.
phaser: "eagle"
gmap_path: .test-run/HCC1395/reference/genetic_map_hg38_withX.txt.gz

##################################################
# Read-depth correction: GC on (from the window BED), replication timing off.
params_count_reads:
  gc_correct: true
  rt_correct: false

##################################################
# Adaptive binning
params_combine_counts:
  min_snp_reads: [3000]
