name: CI

on:
  push:
    branches: [main, dev, "feat/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff + snakefmt (format + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Both are capped: neither pins a rule set, so a minor release changes the
      # verdict on an unchanged commit. ruff 0.16 adds LOG015/I001/EXE001 (217 hits)
      # and formats python blocks inside Markdown; snakefmt 2.0 runs shfmt over every
      # shell: directive. Raise a cap only together with the churn it brings.
      - run: pip install "ruff>=0.15,<0.16" "snakefmt>=1.1,<2"
      # F821 is the point: no `import *` hides an undefined name in a script:
      - run: ruff check .
      - run: ruff format --check .
      - run: snakefmt --check workflow/

  dryrun:
    name: pytest + snakemake dry-run (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install snakemake + DAG-parse deps
        run: |
          python -m pip install --upgrade pip
          pip install "snakemake>=9" snakemake-storage-plugin-http snakemake-storage-plugin-fs \
                      pandas numpy scipy numba pyyaml pulp pytest

      - name: pytest (DAG dry-run, all modes x JSON/TSV)
        run: pytest tests/
