name: it-HCC1395

# End-to-end integration test: bulk_genotyping, hg38 Illumina WGS, chr6 + chr16.
# Real HCC1395/HCC1395BL (SEQC2) tumor-normal pair; whole-genome BAMs stream from NCBI
# ReferenceSamples and are region-subset to chr6+chr16 (subset_remote_alignment). Eagle2
# statistical phasing against the 1000G panel. Heavy (remote slicing + 1000G panel
# download + per-rule conda builds): manual + weekly.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"  # Mondays 09:00 UTC

concurrency:
  group: it-HCC1395
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash -el {0}  # login shell so `conda activate` works
    env:
      CASE: tests/data/HCC1395
      RUN: ${{ github.workspace }}/.test-run/HCC1395
    steps:
      - name: Free disk space
        if: ${{ !env.ACT }}  # GitHub runner only; these paths are busy mounts under act
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - uses: actions/checkout@v4

      # --- install: runner engine env + a tools env for reference staging ---
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: genotyping-env
          environment-file: environment.yaml
          conda-remove-defaults: true

      # prepare_refs.sh needs bcftools/samtools/bgzip/tabix + wget (1000G panel download),
      # not any pipeline env; the per-tool rule envs (eagle/bcftools/mosdepth/samtools --
      # only what the DAG needs) build next. Keeps: prepare -> build envs -> run.
      - name: Create reference-staging env
        run: mamba create -y -n genotyping-prep -c bioconda -c conda-forge bcftools samtools htslib wget

      # --- prepare: stage hg38 chr6+chr16 reference + 1000G panel + Eagle map ---
      - name: Prepare references
        run: |
          conda activate genotyping-prep
          bash "$CASE/prepare_refs.sh"

      # --- install per-rule conda envs (separate from the run) ---
      - name: Build per-rule conda envs
        run: |
          conda activate genotyping-env
          snakemake -s workflow/Snakefile \
            --configfile "$CASE/config.yaml" \
            --profile profile/ --cores 4 \
            --conda-create-envs-only

      # --- run: full pipeline to bb_dir; outputs isolated under $RUN ---
      # `act` runs this same workflow in a Linux container, so CI and local match.
      - name: Run pipeline
        run: |
          conda activate genotyping-env
          CORES=4 bash "$CASE/run_pipeline.sh"

      # --- check: assert the expected bulk outputs exist and are non-empty ---
      - name: Check outputs
        run: bash "$CASE/check_outputs.sh"

      - name: Upload outputs
        if: ${{ always() && !env.ACT }}  # GitHub only; act can't run the JS action (no node), outputs are on host via --bind
        uses: actions/upload-artifact@v4
        with:
          name: bb_dir-and-qc-HCC1395
          path: |
            ${{ env.RUN }}/bb/**
            ${{ env.RUN }}/qc/**
          if-no-files-found: warn
          retention-days: 14
